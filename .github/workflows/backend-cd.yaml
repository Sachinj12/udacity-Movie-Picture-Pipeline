name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Lint
        working-directory: starter/backend
        run: pipenv run lint

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Test
        working-directory: starter/backend
        run: pipenv run test

  backend-build:
    name: Backend Build and Push
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR repository URL
        id: ecr
        run: |
          REPOSITORY_URI=$(aws ecr describe-repositories \
            --repository-names backend \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "repository_uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag "${{ steps.ecr.outputs.repository_uri }}:${{ github.sha }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.ecr.outputs.repository_uri }}:${{ github.sha }}"

  backend-deploy:
    name: Backend Deploy
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name cluster \
            --region "${{ secrets.AWS_REGION }}"

      - name: Get ECR repository URL
        id: ecr
        run: |
          REPOSITORY_URI=$(aws ecr describe-repositories \
            --repository-names backend \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "repository_uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"

      - name: Set Kubernetes image
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image \
            backend=${{ steps.ecr.outputs.repository_uri }}:${{ github.sha }}

      - name: Deploy to Kubernetes
        working-directory: starter/backend/k8s
        run: |
          kustomize build | kubectl apply -f -

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s
